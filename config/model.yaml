model_selection:
  module_0:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      max_depth:
        - 6
        - 9
        - 12
      n_estimators:
        - 100
        - 200
        - 350
      criterion:
        - gini
        - entropy
  module_1:
    class: XGBClassifier
    module: xgboost
    params:
      learning_rate:
        - 0.01
        - 0.05
        - 0.1
      n_estimators:
        - 100
        - 200
        - 300
      max_depth:
        - 3
        - 5
        - 7
  module_2:
    class: GradientBoostingClassifier
    module: sklearn.ensemble
    params:
      learning_rate:
        - 0.01
        - 0.1
      n_estimators:
        - 100
        - 200
      max_depth:
        - 3
        - 5
