<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Visa Approval Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 700px;
      width: 100%;
      padding: 2.5rem 3rem;
    }
    h1 {
      font-size: 1.8rem;
      color: #1a237e;
      margin-bottom: 0.4rem;
    }
    p.subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    .field {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.3rem;
    }
    input, select {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0.55rem 0.8rem;
      font-size: 0.95rem;
      color: #333;
      background: #fafafa;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3f51b5;
      background: #fff;
    }
    .actions {
      margin-top: 1.8rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    button[type="submit"] {
      background: #3f51b5;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #303f9f; }
    a.train-link {
      font-size: 0.9rem;
      color: #3f51b5;
      text-decoration: none;
      border: 1px solid #3f51b5;
      padding: 0.65rem 1.2rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    a.train-link:hover { background: #e8eaf6; }
    .result-box {
      margin-top: 1.5rem;
      padding: 1rem 1.4rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
    }
    .result-certified { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .result-denied    { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .result-error     { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
  </style>
</head>
<body>
<div class="container">
  <h1>US Visa Approval Predictor</h1>
  <p class="subtitle">Fill in the applicant details to predict visa case status.</p>

  <form action="/predict" method="post">
    <div class="grid">

      <div class="field">
        <label for="continent">Continent</label>
        <select name="continent" id="continent" required>
          <option value="">-- Select --</option>
          <option>Asia</option>
          <option>Africa</option>
          <option>Europe</option>
          <option>North America</option>
          <option>South America</option>
          <option>Oceania</option>
        </select>
      </div>

      <div class="field">
        <label for="education_of_employee">Education</label>
        <select name="education_of_employee" id="education_of_employee" required>
          <option value="">-- Select --</option>
          <option>High School</option>
          <option>Associate</option>
          <option>Bachelor's</option>
          <option>Master's</option>
          <option>Doctorate</option>
        </select>
      </div>

      <div class="field">
        <label for="has_job_experience">Has Job Experience</label>
        <select name="has_job_experience" id="has_job_experience" required>
          <option value="">-- Select --</option>
          <option value="Y">Yes</option>
          <option value="N">No</option>
        </select>
      </div>

      <div class="field">
        <label for="requires_job_training">Requires Job Training</label>
        <select name="requires_job_training" id="requires_job_training" required>
          <option value="">-- Select --</option>
          <option value="Y">Yes</option>
          <option value="N">No</option>
        </select>
      </div>

      <div class="field">
        <label for="no_of_employees">Number of Employees</label>
        <input type="number" name="no_of_employees" id="no_of_employees"
               min="1" placeholder="e.g. 2500" required />
      </div>

      <div class="field">
        <label for="yr_of_estab">Year of Establishment</label>
        <input type="number" name="yr_of_estab" id="yr_of_estab"
               min="1800" max="2024" placeholder="e.g. 2005" required />
      </div>

      <div class="field">
        <label for="region_of_employment">Region of Employment</label>
        <select name="region_of_employment" id="region_of_employment" required>
          <option value="">-- Select --</option>
          <option>West</option>
          <option>Northeast</option>
          <option>South</option>
          <option>Midwest</option>
          <option>Island</option>
        </select>
      </div>

      <div class="field">
        <label for="prevailing_wage">Prevailing Wage</label>
        <input type="number" step="0.01" name="prevailing_wage" id="prevailing_wage"
               min="0" placeholder="e.g. 75000.00" required />
      </div>

      <div class="field">
        <label for="unit_of_wage">Unit of Wage</label>
        <select name="unit_of_wage" id="unit_of_wage" required>
          <option value="">-- Select --</option>
          <option>Hour</option>
          <option>Week</option>
          <option>Month</option>
          <option>Year</option>
        </select>
      </div>

      <div class="field">
        <label for="full_time_position">Full Time Position</label>
        <select name="full_time_position" id="full_time_position" required>
          <option value="">-- Select --</option>
          <option value="Y">Yes</option>
          <option value="N">No</option>
        </select>
      </div>

    </div><!-- /grid -->

    <div class="actions">
      <button type="submit">Predict</button>
      <a href="/train" class="train-link">Retrain Model</a>
    </div>
  </form>

  {% if context is defined and context != "Rendering" %}
    <div class="result-box
      {% if 'Certified' in context %}result-certified
      {% elif 'Denied' in context %}result-denied
      {% else %}result-error{% endif %}">
      {{ context }}
    </div>
  {% endif %}
</div>
</body>
</html>
